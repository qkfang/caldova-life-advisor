<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Life Advice Guru">
  <defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3c27a"/>
      <stop offset="100%" stop-color="#c9a14a"/>
    </linearGradient>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13294f"/>
      <stop offset="100%" stop-color="#0b1d3a"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#g-bg)"/>
  <!-- "G" for Life Advice Guru: the crossbar runs into the shield -->
  <path d="M44 20.5 A16 16 0 1 0 48 32 H38" fill="none" stroke="url(#g-gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Teal shield: protection -->
  <path d="M33 22.5 l9 3.4 v6.4 c0 6.3-3.9 10.6-9 12.6 c-5.1-2-9-6.3-9-12.6 v-6.4 z" fill="#14b8a6"/>
  <path d="M28.6 33.2 l3.2 3.2 l5.6-6" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
