<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Guru House — Advice Team in a Day · Life Advice Guru</title>
    <link rel="stylesheet" href="/src/v2/v2.css" />
  </head>
  <body data-page="cover">
    <div class="v2-sky" aria-hidden="true"></div>
    <canvas id="v2Canvas" touch-action="none" aria-label="Guru House, a voxel heritage bank building with four levels"></canvas>
    <div id="v2-callouts" class="v2-callouts"></div>

    <header class="v2-top">
      <div class="v2-top-left">
        <a class="v2-brand" href="/" title="Back to the cover">
          <span class="logo">G</span>
          <span class="v2-brand-text"><strong>Life Advice Guru</strong><small>Advice Team in a Day · Guru House</small></span>
        </a>
        <button id="v2-shrink-all" type="button" class="v2-shrink-all" aria-expanded="true" aria-label="Shrink all panels" title="Shrink all panels"><span aria-hidden="true">−</span></button>
      </div>
    </header>

    <section id="v2-cover" class="v2-cover" aria-label="Storybook cover"></section>
    <article id="v2-page" class="v2-page hidden" aria-live="polite"></article>
    <nav id="v2-lift" class="v2-lift" aria-label="Lift: choose a level"></nav>
    <nav id="v2-pan" class="v2-pan" aria-label="Move the view left or right"></nav>
    <aside id="v2-inspector" class="v2-inspector hidden" aria-live="polite"></aside>
    <button id="v2-pill" type="button" class="v2-pill hidden">📖 Open the storybook</button>
    <div id="v2-tooltip" class="v2-tooltip hidden" role="tooltip"></div>
    <div id="v2-loading" class="v2-loading" role="status"><span></span>Building Guru House…</div>

    <script type="module" src="/src/v2/main.ts"></script>
  </body>
</html>
